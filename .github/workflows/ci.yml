name: Windows CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Check and test
        run: |
          cargo check --locked
          cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets
      - name: Release build
        run: cargo build --release --locked
      - name: Smoke test
        shell: pwsh
        run: |
          .\target\release\waifu.exe --version
          if ($LASTEXITCODE -ne 0) { throw "waifu --version failed" }
          .\target\release\waifu.exe doctor
          if ($LASTEXITCODE -ne 0) { throw "doctor failed" }
          .\target\release\waifu.exe git --help
          if ($LASTEXITCODE -ne 0) { throw "git help failed" }
      - name: Validate PowerShell scripts and installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scripts = @('install.ps1','uninstall.ps1','update.ps1','waifu-shell.ps1','waifu-completion.ps1')
          foreach ($file in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file).Path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              throw "PowerShell parsing failed for $file : $($errors -join '; ')"
            }
          }
          $stage = Join-Path $env:RUNNER_TEMP 'waifu-install-smoke'
          .\install.ps1 -InstallDir $stage -NoProfile -NoPath
          if (-not (Test-Path (Join-Path $stage 'waifu.exe'))) { throw 'install.ps1 failed' }
          & (Join-Path $stage 'waifu.exe') --version
          & (Join-Path $stage 'waifu.exe') git --help
          . (Join-Path $stage 'waifu-completion.ps1')
          .\uninstall.ps1 -InstallDir $stage -WhatIf
          .\uninstall.ps1 -InstallDir $stage
          if (Test-Path (Join-Path $stage 'waifu.exe')) { throw 'uninstall.ps1 failed' }
      - name: Upload compiled binary
        uses: actions/upload-artifact@v4
        with:
          name: waifu-windows-x64-ci
          path: |
            target/release/waifu.exe
            target/release/waifu.json
            target/release/speak.py
          if-no-files-found: error
