name: Windows Release

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # Branch commits prefixed "release: vX.Y.Z" can create the tag via gh release.
    # This preserves conventional tag-triggered releases too.
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      (github.ref == 'refs/heads/master' && startsWith(github.event.head_commit.message, 'release: v'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - name: Pack release and write checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force .\dist\package | Out-Null
          $files = @(
            @{From='target/release/waifu.exe'; To='waifu.exe'},
            @{From='target/release/waifu.json'; To='waifu.json'},
            @{From='target/release/speak.py'; To='speak.py'},
            @{From='waifu-shell.ps1'; To='waifu-shell.ps1'},
            @{From='waifu-completion.ps1'; To='waifu-completion.ps1'},
            @{From='install.ps1'; To='install.ps1'},
            @{From='uninstall.ps1'; To='uninstall.ps1'},
            @{From='update.ps1'; To='update.ps1'},
            @{From='README.md'; To='README.md'}
          )
          foreach ($f in $files) {
            Copy-Item -LiteralPath $f.From -Destination (Join-Path '.\dist\package' $f.To) -ErrorAction Stop
          }
          Compress-Archive -Path .\dist\package\* -DestinationPath .\dist\waifu-windows-x64.zip -CompressionLevel Optimal -Force
          $hash = (Get-FileHash -LiteralPath .\dist\waifu-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  waifu-windows-x64.zip" | Set-Content -LiteralPath .\dist\SHA256SUMS.txt -Encoding ascii
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: waifu-windows-x64-release
          path: |
            dist/waifu-windows-x64.zip
            dist/SHA256SUMS.txt
      - name: Test packaged archive and installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $extract = Join-Path $env:RUNNER_TEMP 'waifu-release-zip-check'
          $install = Join-Path $env:RUNNER_TEMP 'waifu-release-install-check'
          Expand-Archive -LiteralPath .\dist\waifu-windows-x64.zip -DestinationPath $extract -Force
          & (Join-Path $extract 'waifu.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'ZIP executable failed' }
          & (Join-Path $extract 'waifu.exe') doctor
          if ($LASTEXITCODE -ne 0) { throw 'ZIP doctor failed' }
          & (Join-Path $extract 'install.ps1') -InstallDir $install -NoProfile -NoPath
          if (-not (Test-Path (Join-Path $install 'waifu.exe'))) { throw 'ZIP installer failed' }
          & (Join-Path $install 'uninstall.ps1') -InstallDir $install
          if (Test-Path (Join-Path $install 'waifu.exe')) { throw 'ZIP uninstaller failed' }
      - name: Publish GitHub Release
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.ref == 'refs/heads/master' && startsWith(github.event.head_commit.message, 'release: v'))
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $subject = (git log -1 --format=%s).Trim()
            $releaseMatch = [regex]::Match($subject, '^release: (v[0-9]+[.][0-9]+[.][0-9]+)\z')
            if (-not $releaseMatch.Success) {
            }
            $tag = $releaseMatch.Groups[1].Value
          }
          $versionLine = Get-Content .\Cargo.toml | Where-Object { $_ -match '^version\s*=\s*"[0-9]+\.[0-9]+\.[0-9]+"' } | Select-Object -First 1
          if (-not $versionLine -or $versionLine -notmatch '"([0-9]+\.[0-9]+\.[0-9]+)"') {
            throw 'Cannot read crate version from Cargo.toml'
          }
          if ($tag -ne ('v' + $Matches[1])) {
            throw "Release tag $tag does not match Cargo.toml version"
          }
          # --target creates the tag at the exact tested commit when missing.
          gh release create "$tag" `
            .\dist\waifu-windows-x64.zip `
            .\dist\SHA256SUMS.txt `
            --target "$env:GITHUB_SHA" `
            --title "waifu-cli $tag" `
            --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release upload failed' }
