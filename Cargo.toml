[package]
name = "waifu-ping"
version = "0.1.1"
license = "MIT"
edition = "2021"
build = "build.rs"

[[bin]]
name = "waifu"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
colored = "2.0"
ping-rs = "0.1.2"
rand = "0.8"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Prefer smaller distributed binaries over faster release compilation.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
